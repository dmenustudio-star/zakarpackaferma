<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Закарпатське Газдинство TG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <script>
        const setVh = () => {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        };
        window.addEventListener('resize', setVh);
        setVh();
    </script>
</head>
<body>

    <header class="top-bar">
        <div class="stat-badge money-badge">
            <span class="icon">💰</span>
            <div class="badge-info">
                <span class="badge-label">КАСА</span>
                <div><span id="money-display" class="val">0</span> <small>грн</small></div>
            </div>
        </div>
        <div class="stat-badge ducat-badge">
            <span class="icon">🪙</span>
            <div class="badge-info">
                <span class="badge-label">ДУКАТИ</span>
                <span id="ducats-display" class="val">0</span>
            </div>
        </div>
        <div class="stat-badge income-badge">
            <span class="icon">⚡</span>
            <div class="badge-info">
                <span class="badge-label">ДОХІД</span>
                <span class="badge-value">+<span id="passive-income">0</span>/с</span>
            </div>
        </div>
        <!-- Кнопка налаштувань -->
        <button class="settings-top-btn" onclick="openModal('settings-modal')">⚙️</button>
    </header>

    <div id="toast-container" class="toast-container"></div>

    <div id="random-event" class="random-event hidden" onclick="handleEventClick()">
        <span id="event-icon">🪲</span>
        <span id="event-text">Жук! Тапай!</span>
    </div>

    <main class="game-container">
        <section class="surface">
            <div class="sun"></div>
            <div class="clouds">
                <div class="cloud cloud-1">☁️</div>
                <div class="cloud cloud-2">☁️</div>
            </div>
            <div class="mountains"></div>
            <div class="hills"></div>
            
            <button id="tap-btn" class="tap-btn">
                <div class="btn-shine"></div>
                <span class="btn-icon">🔨</span>
                <div class="btn-content">
                    <span class="btn-text">КЛЕПАТИ МОТИКОВ!</span>
                    <span class="btn-subtext">+<span id="click-power-display">1</span> грн/тап</span>
                </div>
            </button>

            <div class="action-panel">
                <button class="menu-btn wheel-btn" onclick="openModal('wheel-modal')">🎡 Рулетка</button>
                <button class="menu-btn boost-btn" onclick="openModal('boosts-modal')">🧪 Допінг</button>
                <button class="menu-btn quest-btn" onclick="openModal('quests-modal')">📜 Квести</button>
                <button id="prestige-btn" class="prestige-btn" onclick="doPrestige()">⛵ Сплав</button>
            </div>
        </section>

        <section class="underground">
            <div id="beds-list" class="beds-container"></div>
        </section>
    </main>

    <!-- Модалки -->
    <div id="wheel-modal" class="modal hidden">
        <div class="modal-content">
            <h3>🎡 Колесо Фортуни</h3>
            <p>Випробуй газдівську удачу!</p>
            <div id="wheel-display" class="wheel-box">❓</div>
            <button class="btn-action" onclick="spinWheel()">КРУТИТИ</button>
            <button class="btn-close" onclick="closeModal('wheel-modal')">Закрити</button>
        </div>
    </div>

    <div id="boosts-modal" class="modal hidden">
        <div class="modal-content">
            <h3>🧪 Закарпатські Допінги</h3>
            <div class="boosts-list">
                <div class="boost-card">
                    <div><strong>🍶 Палинка (x5 Тап)</strong><br><small>30 сек • 500 грн</small></div>
                    <button class="btn-action" onclick="buyBoost('palynka', 500)">Випити</button>
                </div>
                <div class="boost-card">
                    <div><strong>🥣 Банош (x3 Дохід)</strong><br><small>60 сек • 1500 грн</small></div>
                    <button class="btn-action" onclick="buyBoost('banosh', 1500)">З'їсти</button>
                </div>
            </div>
            <button class="btn-close" onclick="closeModal('boosts-modal')">Закрити</button>
        </div>
    </div>

    <div id="quests-modal" class="modal hidden">
        <div class="modal-content">
            <h3>📜 Завдання Газдам</h3>
            <div id="quests-list" class="quests-list"></div>
            <button class="btn-close" onclick="closeModal('quests-modal')">Закрити</button>
        </div>
    </div>

    <!-- Модалка налаштувань -->
    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <h3>⚙️ Налаштування</h3>
            <div class="boosts-list">
                <div class="boost-card">
                    <div><strong>🎵 Фонова музика</strong></div>
                    <button id="music-toggle-btn" class="btn-action" onclick="toggleMusic()">Увімкнено</button>
                </div>
                <div class="boost-card">
                    <div><strong>🔊 Звукові ефекти</strong></div>
                    <button id="sfx-toggle-btn" class="btn-action" onclick="toggleSfx()">Увімкнено</button>
                </div>
            </div>
            <button class="btn-close" onclick="closeModal('settings-modal')">Закрити</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
